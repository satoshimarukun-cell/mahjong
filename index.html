<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀譜 — 麻雀成績管理</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#a01414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雀譜">
<link rel="apple-touch-icon" href="./icon-180.png">

<style>
:root{
  --red:#a01414;
  --gold:#d4af37;
  --paper:#fffaf0;
  --panel:#ffffff;
  --text:#222;
  --muted:#777;
  --orange:#f08a24;
  --cyan:#22a7c7;
  --line:#e5e5e5;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  color:var(--text);
  background:#f5f5f7;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(520px,620px) minmax(600px,1fr);
}
.left{
  background:var(--red);
  color:#fff;
  min-height:100vh;
  padding:16px;
  overflow:auto;
}
.right{
  background:#fafafa;
  min-height:100vh;
  overflow:auto;
}
.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.header h1{
  color:var(--gold);
  font-size:34px;
  margin:0;
  font-weight:900;
  letter-spacing:.02em;
}
.header .spacer{flex:1}
.icon-btn{
  border:none;
  background:transparent;
  color:#fff;
  font-size:24px;
}
.card{
  background:rgba(255,255,255,.94);
  color:var(--text);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}
.date-row{
  display:flex;
  gap:10px;
  align-items:center;
}
.date-row label{font-weight:700}
.date-row input{
  margin-left:auto;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px 10px;
  background:#fff;
}
.player-row{
  display:grid;
  grid-template-columns:46px minmax(150px,1fr) 52px 124px 62px;
  gap:8px;
  align-items:center;
  padding:6px 0;
}
.rank-badge{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;border:2px solid var(--gold);
  background:transparent;
}
.player-select-wrap{
  border-radius:9px;
  padding:3px;
}
.player-select{
  width:100%;
  border:none;
  padding:9px 8px;
  border-radius:7px;
  font-weight:700;
  background:rgba(255,255,255,.75);
}
.yaku-btn{
  min-height:40px;
  border:none;
  background:transparent;
  font-size:14px;
}
.score-btn{
  min-height:46px;
  background:#fff;
  border:1px solid transparent;
  border-radius:8px;
  padding:0 10px;
  text-align:right;
  font-weight:800;
  font-size:24px;
  color:#111;
}
.score-btn.focused{
  border:3px solid var(--gold);
  transform:scale(1.03);
}
.score-btn small{
  color:#888;font-size:17px;font-weight:600
}
.pt{
  text-align:right;
  font-size:19px;
  font-weight:900;
}
.plus{color:var(--orange)}
.minus{color:var(--cyan)}
.save-row{
  display:flex;
  gap:12px;
  align-items:center;
}
.total-box{min-width:150px}
.total-box .caption{font-size:12px;color:#777}
.total-box .value{font-size:28px;font-weight:900}
.total-ok{color:#19a957}
.total-ng{color:#d22}
.save-btn{
  flex:1;border:none;border-radius:10px;padding:13px 16px;
  background:var(--gold);color:var(--red);font-weight:900;font-size:19px;
}
.save-btn:disabled{background:#9a9a9a;color:#6b1717;opacity:.7}
.rule{
  color:#fff;
  font-weight:800;
  font-size:14px;
  opacity:.96;
  margin:2px 4px 16px;
}
.score-table{
  background:#fff;
  color:#333;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  line-height:1.55;
}
.score-table h3{margin:0 0 8px;color:var(--red)}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:16px;
  position:sticky;top:0;z-index:5;
  background:rgba(250,250,250,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #eee;
}
.topbar h2{margin:0;font-size:25px}
.topbar .spacer{flex:1}
.btn{
  border:none;border-radius:9px;padding:9px 14px;font-weight:800;
  background:#e9e9e9;color:#222;
}
.btn.active{background:#2479e8;color:#fff}
.btn.danger{background:#ffe9e9;color:#c22}
.btn.primary{background:var(--red);color:var(--gold)}
.date-tabs{
  display:flex;gap:8px;overflow:auto;
  padding:10px 16px;
  border-bottom:1px solid #eee;
  background:#fff;
}
.date-tab{
  white-space:nowrap;border:none;border-radius:18px;
  padding:7px 12px;background:#eee;font-size:12px;font-weight:800;
}
.date-tab.active{background:#2479e8;color:#fff}
.daily{
  background:#fff;
  padding:12px 16px;
  border-bottom:1px solid #eee;
}
.daily-title{font-size:12px;font-weight:900;color:#777;margin:0 0 6px}
.daily-row{
  display:grid;
  grid-template-columns:90px 48px minmax(120px,1fr) 70px 64px 110px;
  gap:6px;align-items:center;
  padding:8px 0;border-bottom:1px solid #eee;
}
.name-chip{
  display:inline-block;
  padding:2px 6px;
  border-radius:5px;
  font-size:14px;font-weight:900;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rank-seq{
  display:flex;gap:4px;overflow:auto;font-weight:900;
}
.rank-seq span{min-width:13px;text-align:center}
.history-wrap{overflow:auto;background:#fff}
.history-table{
  min-width:660px;
  width:max-content;
  border-collapse:collapse;
}
.history-table th,.history-table td{
  border-bottom:1px solid #eee;
  border-right:1px solid #eee;
  padding:9px 8px;
  text-align:center;
  min-width:115px;
  font-size:12px;
}
.history-table th:first-child,.history-table td:first-child{min-width:44px}
.history-table th.op,.history-table td.op{min-width:105px}
.history-table thead th{
  background:#f4f4f4;position:sticky;top:0;z-index:1;
}
.h-player{
  padding:3px 6px;border-radius:5px;font-weight:900
}
.small-btn{
  border:none;border-radius:5px;padding:5px 7px;font-weight:800;font-size:12px;margin:1px
}
.small-btn.edit{color:#1267cf;background:#e8f1ff}
.small-btn.del{color:#c22;background:#ffe8e8}
.rmini{
  display:inline-block;border-radius:4px;padding:2px 4px;font-weight:900;font-size:10px;margin-right:6px
}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal.show{display:flex}
.modal-card{
  width:min(760px,96vw);max-height:90vh;overflow:auto;
  background:#fff;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.3);
}
.modal-head{
  display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid #eee;
  position:sticky;top:0;background:#fff;z-index:2
}
.modal-head h3{margin:0;font-size:24px}
.modal-head .spacer{flex:1}
.modal-body{padding:18px}
.section{margin-bottom:22px}
.section h4{margin:0 0 10px}
.form-row{
  display:flex;gap:10px;align-items:center;padding:8px 0;
}
.form-row label{min-width:120px;font-weight:700}
.form-row input{
  flex:1;border:1px solid #ddd;border-radius:8px;padding:9px 10px;
}
.player-edit-row{
  display:grid;grid-template-columns:1fr 60px 72px;gap:8px;align-items:center;margin-bottom:8px;
}
.player-edit-row input[type=text]{
  width:100%;border:1px solid #ddd;border-radius:8px;padding:9px
}
.player-edit-row input[type=color]{
  width:48px;height:36px;border:none;background:none
}
.stats-list{display:flex;flex-direction:column;gap:12px}
.stats-card{
  border:1px solid #e6e6e6;border-radius:14px;padding:14px;
  display:grid;grid-template-columns:220px 260px 1fr;gap:14px;align-items:center;
}
.stats-left{
  display:flex;gap:12px;align-items:center
}
.pie{
  width:54px;height:54px;border-radius:50%;position:relative;flex:0 0 auto
}
.pie::after{
  content:"";position:absolute;inset:14px;background:#fff;border-radius:50%
}
.stats-name{font-size:20px;font-weight:900}
.stats-ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stats-rank{
  padding:7px 4px;border-radius:7px;text-align:center;font-size:11px;font-weight:800
}
.stats-rank strong{display:block;font-size:18px}
.trend{
  position:relative;height:90px;background:#fafafa;border-radius:8px;overflow:hidden
}
.trend svg{position:absolute;inset:0;width:100%;height:100%}
.trend .emoji{position:absolute;transform:translate(-50%,-50%);font-size:12px}
.keypad{
  position:fixed;
  left:calc(min(620px, 50vw) + 14px);
  top:50%;transform:translateY(-50%);
  width:240px;background:var(--red);padding:12px;border-radius:15px;
  z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.3);
  display:none;
}
.keypad.show{display:block}
.key-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px
}
.key-grid button,.key-done{
  border:none;border-radius:8px;min-height:52px;background:#fff;
  color:#111;font-size:21px;font-weight:900
}
.key-done{
  margin-top:8px;width:100%;background:var(--gold);color:var(--red);
  min-height:48px;font-size:17px
}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.overlay.show{display:flex}
.overlay-card{width:min(900px,94vw);text-align:center}
.overlay-title{font-size:42px;color:var(--gold);font-weight:900;margin-bottom:20px}
.rank-result{
  display:flex;min-height:80px;margin:12px 70px;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,.1);transform:translateX(50px);opacity:0;
  transition:.35s ease;
}
.rank-result.show{transform:translateX(0);opacity:1}
.rank-side{width:86px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.rank-main{display:flex;align-items:center;flex:1;color:#fff;padding:0 28px;gap:12px}
.rank-main .name{font-size:22px;font-weight:900}
.rank-main .pts{margin-left:auto;font-size:36px;font-weight:900}
.overlay-done{
  display:none;margin:20px auto 0;border:none;border-radius:25px;padding:14px 50px;
  background:var(--gold);color:var(--red);font-weight:900;font-size:18px
}
.empty{
  padding:40px;text-align:center;color:#999
}
.locked{opacity:.58;pointer-events:none}
.file-hidden{display:none}
@media(max-width:1000px){
  .app{display:block}
  .left,.right{min-height:auto}
  .keypad{left:50%;top:auto;bottom:18px;transform:translateX(-50%)}
  .stats-card{grid-template-columns:1fr}
}
</style>

<style>
@media (display-mode: standalone) {
  body { overscroll-behavior: none; }
  .left { padding-top: max(16px, env(safe-area-inset-top)); }
}
</style>

<body>
<div class="app">
  <section class="left">
    <div class="header">
      <h1>🀄️ 麻雀成績入力</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
    </div>

    <div class="card">
      <div class="date-row">
        <label>対局日</label>
        <input type="date" id="gameDate">
      </div>
    </div>

    <div class="card" id="inputCard"></div>

    <div class="card">
      <div class="save-row">
        <div class="total-box">
          <div class="caption" id="totalCaption">合計点</div>
          <div>
            <span class="value total-ng" id="totalScore">0</span>
            <button class="small-btn edit" id="cancelEditBtn" style="display:none">解除</button>
          </div>
        </div>
        <button class="save-btn" id="saveBtn" disabled>終局保存</button>
      </div>
    </div>

    <div class="rule" id="ruleText"></div>

    <div class="score-table">
      <h3>点数入力について</h3>
      点数は下2桁の「00」を省略して入力します。例：25,000点 → <b>250</b>。<br>
      4人合計が100,000点になると順位とポイントが確定します。<br>
      役満ボタンは 0 → ⭐️ → ⭐️⭐️ → ⭐️⭐️⭐️ → 0 の順に切り替わります。
    </div>
  </section>

  <section class="right">
    <div class="topbar">
      <h2>成績履歴・集計</h2>
      <div class="spacer"></div>
      <button class="btn" id="editHistoryBtn">編集</button>
      <button class="btn primary" id="totalStatsBtn">📊 通算成績</button>
    </div>
    <div class="date-tabs" id="dateTabs"></div>
    <div id="historyContent"></div>
  </section>
</div>

<div class="keypad" id="keypad">
  <div class="key-grid" id="keyGrid"></div>
  <button class="key-done" id="keyDone">確定</button>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>設定</h3><div class="spacer"></div>
      <button class="btn active" id="settingsDone">完了</button>
    </div>
    <div class="modal-body">
      <div class="section">
        <h4>ルール設定</h4>
        <div class="form-row"><label>レート</label><input type="number" step="0.1" id="rateInput"></div>
        <div class="form-row"><label>オカ</label><input type="number" step="1" id="okaInput"></div>
        <div class="form-row"><label>ウマ（大）</label><input type="number" step="1" id="umaHighInput"></div>
        <div class="form-row"><label>ウマ（小）</label><input type="number" step="1" id="umaLowInput"></div>
        <div class="form-row"><label>役満賞</label><input type="number" step="10" id="yakumanBonusInput"></div>
      </div>
      <div class="section">
        <h4>名簿</h4>
        <div class="form-row">
          <input type="text" id="newPlayerName" placeholder="新規名">
          <button class="btn active" id="addPlayerBtn">追加</button>
        </div>
        <div id="playerEditor"></div>
      </div>
      <div class="section">
        <h4>データ管理</h4>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn active" id="exportBtn">CSV出力</button>
          <button class="btn" id="importBtn">CSV読込</button>
          <button class="btn danger" id="resetAllBtn">全データ初期化</button>
        </div>
        <input type="file" id="csvFile" class="file-hidden" accept=".csv,text/csv">
      </div>
      <div class="section">
        <h4>BGM</h4>
        <div class="form-row">
          <input type="file" id="bgmFile" accept="audio/*">
          <button class="btn" id="bgmStopBtn">停止</button>
        </div>
        <div style="font-size:12px;color:#777">ブラウザ版では「麻雀学園.m4a」を自動同梱できないため、端末の音声ファイルを選択するとループ再生します。</div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-card" style="width:min(1120px,96vw)">
    <div class="modal-head">
      <h3>通算成績集計</h3><div class="spacer"></div>
      <button class="btn active" id="statsDone">完了</button>
    </div>
    <div class="modal-body">
      <div class="stats-list" id="statsList"></div>
    </div>
  </div>
</div>

<div class="overlay" id="rankingOverlay">
  <div class="overlay-card">
    <div class="overlay-title">最終結果</div>
    <div id="rankingRows"></div>
    <button class="overlay-done" id="overlayDone">完了</button>
  </div>
</div>

<script>
const CONFIG = {
  baseScore:30000,
  totalScorePool:100000,
  graphLimit:50,
  defaultRate:5.0,
  defaultOka:20,
  defaultUmaHigh:10,
  defaultUmaLow:5,
  defaultYakumanBonus:150,
  pandaScoreThreshold:50000
};

const STORAGE_KEY = "mahjong_web_v1";

function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0,v=c==="x"?r:(r&3|8); return v.toString(16);
  });
}

function defaultState(){
  return {
    players:[
      {id:uuid(),name:"プレイヤー1",colorHex:"F8BBD0"},
      {id:uuid(),name:"プレイヤー2",colorHex:"C5CAE9"},
      {id:uuid(),name:"プレイヤー3",colorHex:"C8E6C9"},
      {id:uuid(),name:"プレイヤー4",colorHex:"FFF9C4"}
    ],
    selectedIDs:[],
    history:[],
    settings:{
      oka:CONFIG.defaultOka,
      umaHigh:CONFIG.defaultUmaHigh,
      umaLow:CONFIG.defaultUmaLow,
      yakumanBonus:CONFIG.defaultYakumanBonus,
      rate:CONFIG.defaultRate
    }
  };
}

let state = loadState();
if(!state.selectedIDs || state.selectedIDs.length!==4){
  state.selectedIDs = state.players.slice(0,4).map(p=>p.id);
}
let form = {
  scoresText:["","","",""],
  yakuman:[0,0,0,0],
  gameDate:defaultGameDate(),
  editingID:null,
  editingIndex:null
};
let historyEditing=false;
let selectedDate="";

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const s=JSON.parse(raw);
    if(!s.settings) s.settings={};
    s.settings={
      oka:s.settings.oka ?? CONFIG.defaultOka,
      umaHigh:s.settings.umaHigh ?? CONFIG.defaultUmaHigh,
      umaLow:s.settings.umaLow ?? CONFIG.defaultUmaLow,
      yakumanBonus:s.settings.yakumanBonus ?? CONFIG.defaultYakumanBonus,
      rate:s.settings.rate ?? CONFIG.defaultRate
    };
    s.players=s.players||[];
    s.history=s.history||[];
    if(!s.players.length) return defaultState();
    return s;
  }catch(e){
    return defaultState();
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }

function defaultGameDate(){
  const now=new Date();
  if(now.getHours()<7) now.setDate(now.getDate()-1);
  return toDateInput(now);
}
function toDateInput(d){
  const z=new Date(d);
  const y=z.getFullYear();
  const m=String(z.getMonth()+1).padStart(2,"0");
  const day=String(z.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtDate(v){
  const d=new Date(v);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}/${m}/${day}`;
}
function getPlayer(id){return state.players.find(p=>p.id===id)}
function liveName(id){return getPlayer(id)?.name ?? "不明"}
function liveColor(id){return getPlayer(id)?.colorHex ?? "FFFFFF"}

function parseScores(){
  return form.scoresText.map(v=>(parseInt(v)||0)*100);
}
function totalScore(){return parseScores().reduce((a,b)=>a+b,0)}
function isComplete(){return totalScore()===CONFIG.totalScorePool}
function rankOf(index){
  const vals=parseScores().map((v,i)=>({v,i}));
  vals.sort((a,b)=>b.v-a.v);
  return vals.findIndex(x=>x.i===index)+1;
}
function rankColor(rank){
  return rank===1?"#e53935":rank===2?"#fdd835":rank===3?"#43a047":rank===4?"#111":"transparent";
}
function rankText(rank){return rank===2?"#111":"#fff"}

function calculatePoints(scoresText,yakuman){
  const intScores=scoresText.map(v=>(parseInt(v)||0)*100);
  if(intScores.reduce((a,b)=>a+b,0)!==CONFIG.totalScorePool) return [0,0,0,0];
  const sortedIdx=intScores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).map(x=>x.i);
  const pts=[0,0,0,0];
  const uma=[state.settings.umaHigh,state.settings.umaLow,-state.settings.umaLow,-state.settings.umaHigh];
  let othersSum=0;
  sortedIdx.forEach((idx,rank)=>{
    if(rank!==0){
      const scoreFloor=Math.floor(intScores[idx]/1000)*1000;
      const p=(scoreFloor-CONFIG.baseScore)/1000+uma[rank];
      pts[idx]=p; othersSum+=p;
    }
  });
  pts[sortedIdx[0]]=-othersSum;
  yakuman.forEach((n,i)=>{
    if(n>0){
      const b=n*state.settings.yakumanBonus;
      pts[i]+=b;
      for(let j=0;j<4;j++) if(i!==j) pts[j]-=Math.trunc(b/3);
    }
  });
  return pts;
}

function renderInput(){
  document.getElementById("gameDate").value=form.gameDate;
  const inputCard=document.getElementById("inputCard");

  const ruleSummary=`R:${Number(state.settings.rate).toFixed(1)} ${state.settings.umaHigh}-${state.settings.umaLow} ${state.settings.oka} ${state.settings.yakumanBonus}`;
  const result={
    id:form.editingID||uuid(),

    scores:parseScores(),
    points:pts,

function dates(){
  return [...new Set(state.history.map(h=>fmtDate(h.date)))].sort().reverse();
}
function filteredHistory(){
  return state.history.filter(h=>fmtDate(h.date)===selectedDate);
}

function calcDaily(filtered){
  const ids=[...new Set(filtered.flatMap(h=>h.playerIDs||[]))];
  const map=new Map();
  ids.forEach(id=>map.set(id,{id,name:liveName(id),pts:0,yen:0,count:0,stars:0,ranks:[0,0,0,0],rankSequence:[]}));
  [...filtered].reverse().forEach(h=>{
    ids.forEach(id=>{
      const s=map.get(id);
      const i=(h.playerIDs||[]).indexOf(id);
      if(i>=0){
        s.pts+=h.points[i];
        s.yen+=Math.trunc(h.points[i]*h.rateAtTime*10);
        s.count++;
        s.stars+=h.yakuman[i];
        const sorted=h.scores.map((v,k)=>({v,k})).sort((a,b)=>b.v-a.v);
        const r=sorted.findIndex(x=>x.k===i)+1;
        s.ranks[r-1]++;
        s.rankSequence.push(r);
      }else s.rankSequence.push(0);
    });
  });
  return [...map.values()].sort((a,b)=>b.pts-a.pts).map(s=>{
    s.avg=(s.ranks[0]+s.ranks[1]*2+s.ranks[2]*3+s.ranks[3]*4)/Math.max(1,s.count);
    return s;
  });
}

function calculateStats(){
  const ids=[...new Set(state.history.flatMap(h=>h.playerIDs||[]))];
  const map=new Map();
  ids.forEach(id=>map.set(id,{id,name:liveName(id),totalBalance:0,totalPts:0,count:0,stars:0,ranks:[0,0,0,0],rankTrend:[],scoreTrend:[]}));
  [...state.history].reverse().forEach(h=>{
    for(let i=0;i<4;i++){
      const id=h.playerIDs?.[i];
      if(!id) continue;
      let s=map.get(id);
      if(!s){
        s={id,name:liveName(id),totalBalance:0,totalPts:0,count:0,stars:0,ranks:[0,0,0,0],rankTrend:[],scoreTrend:[]};
        map.set(id,s);
      }
      s.totalBalance+=Math.trunc(h.points[i]*h.rateAtTime*10);
      s.totalPts+=h.points[i];
      s.count++;
      s.stars+=h.yakuman[i];
      const sorted=h.scores.map((v,k)=>({v,k})).sort((a,b)=>b.v-a.v);
      const r=sorted.findIndex(x=>x.k===i)+1;
      s.ranks[r-1]++;
      s.rankTrend.push(r);
      s.scoreTrend.push(h.scores[i]);
      if(s.rankTrend.length>CONFIG.graphLimit){s.rankTrend.shift();s.scoreTrend.shift();}
    }
  });
  return [...map.values()].sort((a,b)=>b.totalPts-a.totalPts);
}

function pieGradient(ranks){
  const total=ranks.reduce((a,b)=>a+b,0)||1;
  const colors=["#e53935","#fdd835","#43a047","#111"];
  let acc=0,parts=[];
  ranks.forEach((n,i)=>{
    const start=acc/total*360;acc+=n;const end=acc/total*360;
    parts.push(`${colors[i]} ${start}deg ${end}deg`);
  });
  return `conic-gradient(${parts.join(",")})`;
}
function trendHtml(s){
  const n=s.rankTrend.length;
  if(n<1) return `<div class="trend"></div>`;
  const W=420,H=90;
  const pts=s.rankTrend.map((r,i)=>{
    const x=n===1?W/2:i/(n-1)*W;
    const y=(r-1)/3*(H-10)+5;
    return {x,y,r,score:s.scoreTrend[i]};
  });
  const grid=[5,(H-10)/3+5,2*(H-10)/3+5,H-5].map(y=>`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#ddd" stroke-dasharray="4 4"/>`).join("");
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#f08a24"/>`).join("");
  const emojis=pts.map(p=>{
    let e="";
    if(p.r===1 && p.score>=CONFIG.pandaScoreThreshold)e="🐼";
    else if(p.score<0)e="💀";
    if(!e)return "";
    return `<span class="emoji" style="left:${p.x/W*100}%;top:${p.y/H*100}%">${e}</span>`;
  }).join("");
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<polyline points="${poly}" fill="none" stroke="#f08a24" stroke-width="2.5"/>${dots}</svg>${emojis}</div>`;
}

  const list=document.getElementById("statsList");

  if(!stats.length){list.innerHTML='<div class="empty">通算成績はまだありません。</div>';return}
  list.innerHTML=stats.map(s=>{

    return `<div class="stats-card">

        <div>
          <div><span class="stats-name" style="background:#${liveColor(s.id)}55;padding:3px 8px;border-radius:6px">${escapeHtml(s.name)}</span> ${s.stars?`<span style="color:#e48a00">⭐️${s.stars}</span>`:""}</div>
          <div class="${s.totalPts>=0?"plus":"minus"}" style="font-weight:900;margin-top:5px">${s.totalPts>=0?"+":""}${s.totalPts} pt</div>
          <div class="${s.totalBalance>=0?"plus":"minus"}" style="font-size:22px;font-weight:900">${s.totalBalance>=0?"+":""}${s.totalBalance}円</div>
        </div>
      </div>
      <div>
        <div class="stats-ranks">
          ${s.ranks.map((n,i)=>`<div class="stats-rank" style="background:${rankColor(i+1)};color:${rankText(i+1)}">${i+1}位<strong>${n}</strong>${(n/Math.max(1,s.count)*100).toFixed(1)}%</div>`).join("")}
        </div>
        <div style="text-align:center;margin-top:8px;font-weight:900;color:${getComputedStyle(document.documentElement).getPropertyValue("--red")}">${s.count}戦 / 平均${avg.toFixed(2)}位</div>

    </div>`;
  }).join("");
}

function exportCSV(){
  let csv="Date,Rule,Rate,P1,S1,Pt1,Y1,P2,S2,Pt2,Y2,P3,S3,Pt3,Y3,P4,S4,Pt4,Y4\n";
  const fmtDT=iso=>{
    const d=new Date(iso);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
    const hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
    return `${y}/${m}/${day} ${hh}:${mm}`;
  };
  state.history.forEach(h=>{
    const row=[fmtDT(h.date),csvEsc(h.ruleSummary),h.rateAtTime];
    for(let i=0;i<4;i++){
      row.push(csvEsc(h.players[i]),h.scores[i],h.points[i],h.yakuman[i]);
    }
    csv+=row.join(",")+"\n";
  });
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="MahjongData.csv";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvEsc(v){
  const s=String(v??"");
  return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"' && text[i+1]==='"'){cell+='"';i++}
      else if(c==='"')q=false;
      else cell+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cell);cell=""}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function importCSVText(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=parseCSV(text);
  if(rows.length<=1)return;
  const newHistory=[];
  for(let r=1;r<rows.length;r++){
    const c=rows[r];
    if(c.length<19)continue;
    const names=[c[3],c[7],c[11],c[15]];
    const ids=names.map(name=>{
      let p=state.players.find(x=>x.name===name);
      if(!p){p={id:uuid(),name,colorHex:"CCCCCC"};state.players.push(p)}
      return p.id;
    });
    const dstr=c[0]?.trim().replace(" ","T").replace(/\//g,"-");
    const d=new Date(dstr);
    newHistory.push({
      id:uuid(),date:isNaN(d)?new Date().toISOString():d.toISOString(),
      playerIDs:ids,players:names,playerColors:["E3F2FD","F1F8E9","FFF3E0","FCE4EC"],
      scores:[+c[4]||0,+c[8]||0,+c[12]||0,+c[16]||0],
      points:[+c[5]||0,+c[9]||0,+c[13]||0,+c[17]||0],
      yakuman:[+c[6]||0,+c[10]||0,+c[14]||0,+c[18]||0],
      ruleSummary:c[1]||"",rateAtTime:+c[2]||CONFIG.defaultRate
    });
  }
  state.history=[...newHistory,...state.history];
  saveState();renderAll();
}

  const sorted=result.scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).map(x=>x.i);

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=660;g.gain.value=.04;
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);
  }catch(e){}
}

document.getElementById("editHistoryBtn").onclick=()=>{
  historyEditing=!historyEditing;
  if(!historyEditing && form.editingID) resetForm();
  renderAll();
};
document.getElementById("totalStatsBtn").onclick=()=>{
  if(historyEditing)return;
  renderStats();document.getElementById("statsModal").classList.add("show");
};
document.getElementById("statsDone").onclick=()=>document.getElementById("statsModal").classList.remove("show");

document.getElementById("settingsBtn").onclick=()=>{
  renderSettings();document.getElementById("settingsModal").classList.add("show");
};
document.getElementById("settingsDone").onclick=()=>{
  applySettings();document.getElementById("settingsModal").classList.remove("show");
};
document.getElementById("addPlayerBtn").onclick=()=>{
  const el=document.getElementById("newPlayerName");
  const name=el.value.trim();if(!name)return;
  state.players.push({id:uuid(),name,colorHex:"E0E0E0"});el.value="";renderSettings();
};
document.getElementById("exportBtn").onclick=exportCSV;
document.getElementById("importBtn").onclick=()=>document.getElementById("csvFile").click();
document.getElementById("csvFile").onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importCSVText(r.result);r.readAsText(f,"utf-8");e.target.value="";
};
document.getElementById("resetAllBtn").onclick=()=>{
  if(!confirm("全履歴・名簿・設定を初期化します。よろしいですか？"))return;
  state=defaultState();state.selectedIDs=state.players.slice(0,4).map(p=>p.id);saveState();resetForm();renderSettings();
};
document.getElementById("keyDone").onclick=()=>{form.editingIndex=null;closeKeypad();renderInput()};
document.getElementById("overlayDone").onclick=()=>document.getElementById("rankingOverlay").classList.remove("show");

let bgmAudio=null;
document.getElementById("bgmFile").onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  if(bgmAudio){bgmAudio.pause();URL.revokeObjectURL(bgmAudio.src)}
  bgmAudio=new Audio(URL.createObjectURL(f));bgmAudio.loop=true;bgmAudio.volume=.5;bgmAudio.play().catch(()=>{});
};
document.getElementById("bgmStopBtn").onclick=()=>{if(bgmAudio)bgmAudio.pause()};

setupKeypad();
renderAll();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>

</body>
</html>
